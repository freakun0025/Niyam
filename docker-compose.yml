# Local development stack. Ollama stays on the host.
name: niyam

services:
  qdrant:
    image: qdrant/qdrant:v1.15.0-unprivileged
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_reservation: 128m
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 2s
      retries: 20

  api:
    image: niyam-api:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      NIYAM_QDRANT_URL: http://qdrant:6333
      NIYAM_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    mem_reservation: 256m
    mem_limit: 1g
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  web:
    image: niyam-web:${APP_VERSION:-dev}
    build:
      context: services/web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - ./services/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:8080" # Port 8080 on the host belongs to Jenkins.
    mem_reservation: 32m
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  qdrant_data: {}
