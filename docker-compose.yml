# Local development stack. Qdrant joins in P2; Ollama stays on the host.
name: niyam

services:
  api:
    image: niyam-api:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:8000:8000"
    mem_reservation: 256m
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    image: niyam-web:${APP_VERSION:-dev}
    build:
      context: services/web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - ./services/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:8080" # Port 8080 on the host belongs to Jenkins.
    mem_reservation: 32m
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
