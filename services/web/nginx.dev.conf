# Docker Compose only: replaces the image config and proxies API routes to the api service.

map $status $niyam_log_level {
    default INFO;
    ~^4     WARNING;
    ~^5     ERROR;
}

map $request_time $niyam_latency_ms {
    default 0;
    "~^0\.0*(\d+)$" $1;
    "~^([1-9]\d*)\.(\d{3})$" $1$2;
}

map $http_x_request_id $niyam_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format niyam_json escape=json
    '{"ts":"$time_iso8601","level":"$niyam_log_level","service":"niyam-web",'
    '"app_version":"dev","pod":"$hostname","event":"http.access",'
    '"request_id":"$niyam_request_id","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"latency_ms":$niyam_latency_ms,'
    '"ua":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout niyam_json;

    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/(api/|version$|readyz$) {
        # Resolve at request time so nginx still starts while the api container is down.
        resolver 127.0.0.11 valid=5s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $niyam_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
