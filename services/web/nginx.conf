# Server config baked into the web image. The Kubernetes Ingress routes API traffic.

map $status $niyam_log_level {
    default INFO;
    ~^4     WARNING;
    ~^5     ERROR;
}

map $request_time $niyam_latency_ms {
    default 0;
    "~^0\.0*(\d+)$" $1;
    "~^([1-9]\d*)\.(\d{3})$" $1$2;
}

map $http_x_request_id $niyam_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Only versioned CSS and JS may be cached long term. index.html is always revalidated.
map "$uri:$arg_v" $niyam_cache_control {
    default "no-cache";
    "~^/.+\.(css|js):.+$" "public, max-age=31536000, immutable";
}

log_format niyam_json escape=json
    '{"ts":"$time_iso8601","level":"$niyam_log_level","service":"niyam-web",'
    '"app_version":"__APP_VERSION__","pod":"$hostname","event":"http.access",'
    '"request_id":"$niyam_request_id","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"latency_ms":$niyam_latency_ms,'
    '"ua":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout niyam_json;

    add_header Cache-Control $niyam_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
