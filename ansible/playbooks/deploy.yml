---
# The only deploy path for people and Jenkins. It must not need sudo.
- name: Release one image tag
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/vault.yml
  roles:
    # ── Extension point: Teammate 2 (P4) ──────────────────────────────
    # Dev-mode Vault loses data on restart, so reseed it before each release.
    # - { role: vault, tags: [vault] }

    # Both are idempotent, so a release also repairs the services the API depends on.
    - { role: ollama, tags: [ollama] }
    - { role: qdrant, tags: [qdrant] }
    - { role: app, tags: [app] }

    # Unchanged documents are skipped, so this is safe on every release.
    - { role: ingest, tags: [ingest] }
