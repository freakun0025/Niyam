---
- name: Validate the release tag
  ansible.builtin.assert:
    that:
      - image_tag is defined
      - image_tag is match('^[0-9a-f]{7,40}$')
    fail_msg: "image_tag must be a git SHA, got: {{ image_tag | default('nothing') }}"
    quiet: true

- name: Deploy the application
  module_defaults:
    kubernetes.core.k8s:
      context: "{{ minikube_profile }}"
    kubernetes.core.k8s_info:
      context: "{{ minikube_profile }}"
  block:
    - name: Apply base objects
      kubernetes.core.k8s:
        state: present
        apply: true
        template: "{{ item }}"
      loop: "{{ app_base_templates }}"

    - name: Read the release record
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: niyam-release
        namespace: "{{ niyam_ns }}"
      register: app_release

    # deployed_at changes only for a new tag, so repeating a deploy reports no change.
    - name: Work out the deployment time
      vars:
        app_release_data: "{{ (app_release.resources | first).data if app_release.resources else {} }}"
      ansible.builtin.set_fact:
        app_deployed_at: >-
          {{ app_release_data.deployed_at
             if app_release_data.current_tag | default('') == image_tag
             else now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}

    # A merge patch keeps last_good_tag, which rollback depends on (WHAT_WILL_BREAK B30).
    - name: Record the current release
      kubernetes.core.k8s:
        state: present
        merge_type: merge
        template: release-configmap.yaml.j2

    - name: Apply workloads, services and ingress
      kubernetes.core.k8s:
        state: present
        apply: true
        template: "{{ item }}"
      loop: "{{ app_workload_templates }}"

    # A failed rollout fails the play, which lets the pipeline stop the release.
    - name: Wait for rollouts
      ansible.builtin.command:
        argv:
          - kubectl
          - "--context={{ minikube_profile }}"
          - "--namespace={{ niyam_ns }}"
          - rollout
          - status
          - "deployment/{{ item }}"
          - "--timeout={{ rollout_timeout_seconds }}s"
      loop: [niyam-api, niyam-web]
      changed_when: false
