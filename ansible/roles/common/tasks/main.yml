---
- name: Install host packages
  become: true
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the shared Ansible environment
  become: true
  ansible.builtin.pip:
    name: "{{ common_ansible_packages }}"
    virtualenv: "{{ common_ansible_venv }}"
    virtualenv_command: python3 -m venv

- name: Put Ansible tools on the system PATH
  become: true
  ansible.builtin.file:
    src: "{{ common_ansible_venv }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: "{{ common_ansible_tools }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check whether Jenkins is installed
  ansible.builtin.getent:
    database: passwd
    key: "{{ jenkins_user }}"
    fail_key: false

- name: Allow Jenkins to use Docker
  become: true
  ansible.builtin.user:
    name: "{{ jenkins_user }}"
    groups: docker
    append: true
  when: ansible_facts.getent_passwd[jenkins_user] | default(none) is not none
  notify: Restart Jenkins
